name: One-time CoS 2.1.51 Windows installer and browser companions
# Runs only when this unique temporary workflow is first added to the isolated build branch.
on:
  push:
    branches:
      - build/windows-x64-v2151-once-20261109
    paths:
      - .github/workflows/one-time-windows-v2151.yml
permissions:
  contents: read
jobs:
  windows-installer:
    name: Build latest Windows x64 installer
    runs-on: windows-2025
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate TypeScript
        run: npm run typecheck
      - name: Package and smoke-test Windows installer
        run: npm run dist:x64
      - name: Upload Windows installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cos-2-1-51-windows-installer
          path: release/Chat-On-Steroids-Setup-x64.exe
          if-no-files-found: error
          retention-days: 7
  browser-extensions:
    name: Rebuild Chrome and Firefox companions
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test Firefox and companion extension packages
        run: npx vitest run --maxWorkers=2 test/firefox-extension-package.test.ts test/extension.test.ts
      - name: Package browser companions
        run: node scripts/build-fork-browser-extensions.mjs
      - name: Validate Firefox extension
        run: npx --yes web-ext@10.7.0 lint --source-dir release/firefox-extension --self-hosted
      - name: Upload browser companions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cos-2-1-51-browser-extensions
          path: |
            release/Chat-On-Steroids-Extension.zip
            release/Chat-On-Steroids-Firefox-Unsigned.zip
          if-no-files-found: error
          retention-days: 7
