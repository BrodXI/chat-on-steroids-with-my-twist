name: Verify animated plugin progress
on:
  push:
    branches: [feature/animated-plugin-refresh-progress]
    paths:
      - '.github/workflows/workspace-progress-verify-temp.yml'
      - 'src/main/workspace-plugin-refresh.ts'
      - 'src/shared/plugin-refresh.ts'
      - 'src/main/plugin-refresh.ts'
      - 'src/renderer/workspace-plugin-refresh.ts'
      - 'src/renderer/index.html'
      - 'src/renderer/settings.css'
      - 'src/preload/index.ts'
      - 'src/main/ipc.ts'
      - 'test/workspace*.test.ts'
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run --maxWorkers=2 test/workspace-plugin-refresh.test.ts test/workspace-plugin-refresh-ui.test.ts test/workspace-refresh-entry.test.ts test/plugin-refresh.test.ts test/plugin-refresh-workflow.test.ts test/renderer-layout.test.ts test/renderer-i18n-source.test.ts
