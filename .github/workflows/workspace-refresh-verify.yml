name: Verify Workspace Refresh Feature

# Temporary targeted verification on this feature branch only.
on:
  push:
    branches: [feature/workspace-refresh-plugins]
    paths:
      - 'src/main/workspace-plugin-refresh.ts'
      - 'src/main/ipc.ts'
      - 'src/preload/index.ts'
      - 'src/renderer/workspace-plugin-refresh.ts'
      - 'src/renderer/main.ts'
      - 'src/renderer/index.html'
      - 'src/renderer/settings.css'
      - 'test/workspace-plugin-refresh*.test.ts'
      - 'test/workspace-refresh-entry.test.ts'
      - '.github/workflows/workspace-refresh-verify.yml'

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run --maxWorkers=2 test/workspace-plugin-refresh.test.ts test/workspace-plugin-refresh-ui.test.ts test/workspace-refresh-entry.test.ts test/plugin-refresh.test.ts test/plugin-refresh-workflow.test.ts
