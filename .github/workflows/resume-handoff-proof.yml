name: Resume handoff candidate test build and sign
on:
  push:
    branches: [fix/resume-delivery-proof-20261114]
permissions:
  contents: write
concurrency:
  group: handoff-candidate-\${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify:privacy
      - run: npm run typecheck
      - name: Handoff integration and extension regression tests
        run: npx vitest run --maxWorkers=2 test/resume.test.ts test/continuation.test.ts test/handoff-answer-recovery.test.ts test/recorded-handoff-recovery.test.ts test/project-compact-send.test.ts test/goal-resume-handoff.test.ts test/extension.test.ts test/firefox-extension-package.test.ts
      - name: Native composer readiness tests
        run: npx vitest run --maxWorkers=1 test/chatgpt-dom-input.test.ts
  windows:
    needs: checks
    runs-on: windows-2025
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist:x64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: handoff-proof-windows
          path: release/Chat-On-Steroids-Setup-x64.exe
          if-no-files-found: error
          retention-days: 14
  firefox:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/build-fork-browser-extensions.mjs
      - name: Validate Mozilla signing identity
        env:
          WEB_EXT_API_KEY: \${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: \${{ secrets.AMO_JWT_SECRET }}
        run: |
          set -euo pipefail
          test -n "$WEB_EXT_API_KEY" && test -n "$WEB_EXT_API_SECRET"
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const file = 'release/firefox-extension/manifest.json';
          const m = JSON.parse(readFileSync(file, 'utf8'));
          if (pkg.version !== '2.1.53' || m.version !== pkg.version || m.browser_specific_settings?.gecko?.id !== 'companion@brodxi.local' || m.browser_specific_settings.gecko.update_url || m.permissions?.includes('debugger')) throw new Error('Unexpected signed extension identity');
          m.version = '2.1.53.3';
          writeFileSync(file, JSON.stringify(m, null, 2) + '\n');
          NODE
          git archive --format=zip --output=release/Chat-On-Steroids-Firefox-Source.zip HEAD extension scripts package.json package-lock.json LICENSE docs/FORK-FIREFOX-SIGNING.md .github/workflows/fork-firefox-sign.yml
          unzip -tq release/Chat-On-Steroids-Firefox-Source.zip
      - name: Request Mozilla unlisted signing
        env:
          WEB_EXT_API_KEY: \${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: \${{ secrets.AMO_JWT_SECRET }}
        run: |
          mkdir -p release/firefox-signed
          npx --yes web-ext@10.7.0 sign --channel=unlisted --source-dir release/firefox-extension --upload-source-code release/Chat-On-Steroids-Firefox-Source.zip --artifacts-dir release/firefox-signed --approval-timeout 1500000 --no-input
          find release/firefox-signed -maxdepth 1 -type f -name '*.xpi' -print -quit | grep -q .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: handoff-proof-firefox
          path: release/firefox-signed/*.xpi
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: handoff-proof-chrome
          path: release/Chat-On-Steroids-Extension.zip
          if-no-files-found: error
          retention-days: 14
  release:
    needs: [checks, windows, firefox]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: \${{ github.token }}
      TAG: cos-custom-v2.1.53-20261114-handoff-proof
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: handoff-proof-windows
          path: assets/windows
      - uses: actions/download-artifact@v4
        with:
          name: handoff-proof-firefox
          path: assets/firefox
      - uses: actions/download-artifact@v4
        with:
          name: handoff-proof-chrome
          path: assets/chrome
      - name: Verify signature and publish source-locked binaries
        run: |
          set -euo pipefail
          exe="$(find assets/windows -type f -name '*.exe' -print -quit)"
          xpi="$(find assets/firefox -type f -name '*.xpi' -print -quit)"
          chrome="$(find assets/chrome -type f -name '*.zip' -print -quit)"
          test -s "$exe" && test -s "$xpi" && test -s "$chrome"
          unzip -tq "$xpi"
          test "$(unzip -p "$xpi" manifest.json | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')" = "2.1.53.3"
          unzip -Z1 "$xpi" | grep -qiE '^META-INF/.*(\.rsa|\.sig)$'
          mkdir -p publish
          cp "$exe" publish/Chat-On-Steroids-Setup-x64-v2.1.53.exe
          cp "$xpi" publish/Chat-On-Steroids-Firefox-Signed-v2.1.53.3.xpi
          cp "$chrome" publish/Chat-On-Steroids-Chrome-Extension.zip
          (cd publish && sha256sum *.exe *.xpi *.zip > SHA256SUMS.txt)
          printf 'GitHub-only source-pinned handoff build at %s. Installer is unsigned; Firefox extension is Mozilla signed.\n' "\${{ github.sha }}" > publish/RELEASE_NOTES.md
          gh release create "$TAG" -R "\${{ github.repository }}" --target "\${{ github.sha }}" --title 'CoS v2.1.53 Handoff Proof Build' --notes-file publish/RELEASE_NOTES.md --prerelease publish/*.exe publish/*.xpi publish/*.zip publish/SHA256SUMS.txt
