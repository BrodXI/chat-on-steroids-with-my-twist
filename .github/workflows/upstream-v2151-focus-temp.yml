name: Focused v2.1.51 sync verification
on:
  push:
    branches: [sync/v2.1.51-integration]
    paths: ['.github/workflows/upstream-v2151-focus-temp.yml']
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify:privacy
      - run: npm run typecheck
      - name: Changed upstream tests and retained custom refresh tests
        run: npx vitest run --maxWorkers=2 test/process-ready.test.ts test/exec.test.ts test/session-bookmarks.test.ts test/plugin-refresh.test.ts test/plugin-refresh-workflow.test.ts test/workspace-plugin-refresh-ui.test.ts test/workspace-plugin-refresh.test.ts test/workspace-refresh-entry.test.ts test/packaging.test.ts
