name: One-time fork CoS v2.1.52 integration verification
on:
  push:
    branches: [sync/v2.1.52-integration]
    paths: ['.github/workflows/verify-v2152-integration-once.yml']
permissions:
  contents: read
jobs:
  regression:
    name: Upstream feature and fork compatibility tests
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Privacy
        run: npm run verify:privacy
      - name: Typecheck
        run: npm run typecheck
      - name: Upstream 2.1.52 features and fork-specific regressions
        run: >
          npx vitest run --maxWorkers=2
          test/auto-skill-routing.test.ts
          test/bridge.test.ts
          test/chatgpt-dom-input.test.ts
          test/renderer-dil-table.test.ts
          test/renderer-scheduled-chat.test.ts
          test/renderer-scheduled-wiring.test.ts
          test/renderer-scheduled.test.ts
          test/scheduled-runs.test.ts
          test/session-search.test.ts
          test/skill-routing.test.ts
          test/session-markdown-export.test.ts
          test/session-list-refresh.test.ts
          test/extension-popup.test.ts
          test/workspace-plugin-refresh-ui.test.ts
          test/workspace-plugin-refresh.test.ts
          test/workspace-refresh-entry.test.ts
          test/plugin-refresh.test.ts
          test/firefox-extension-package.test.ts
  build-and-ui:
    name: App/extension build and UI checks
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build Electron app
        run: npm run build
      - name: Verify upstream Scheduled/UI layout
        run: npm run verify:ui
      - name: Package Chrome and Firefox companions
        run: node scripts/build-fork-browser-extensions.mjs
      - name: Mozilla extension lint
        run: npx --yes web-ext@10.7.0 lint --source-dir release/firefox-extension --self-hosted
